<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>When Feedback Catches You Off Guard — Riipen Career Catalyst</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #ff7c0a;
    --orange-soft: #fff8f1;
    --dark-blue: #050c2a;
    --electric-blue: #2454ff;
    --green: #18733e;
    --purple: #7c3aed;
    --grey-bg: #f7f8fa;
    --border: #e2e4e9;
    --muted: #6b7280;
    --correct-bg: #f0faf4;
    --correct-border: #b8e6cc;
    --incorrect-bg: #fff3f3;
    --incorrect-border: #ffc9c9;
    --model-bg: #f3f7ff;
    --model-border: #c9d7ff;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    color: var(--dark-blue);
    background: var(--white);
    line-height: 1.7;
  }

  /* ── Container ── */

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 40px 24px 60px;
  }

  /* ── Header ── */

  .header {
    border-bottom: 2px solid var(--orange);
    padding-bottom: 16px;
    margin-bottom: 32px;
  }

  .header .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--orange);
    font-weight: 600;
    margin-bottom: 6px;
  }

  .header h1 {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 6px;
    color: var(--dark-blue);
  }

  .header .subtitle {
    font-size: 14px;
    color: var(--muted);
    font-style: italic;
  }

  /* ── Context Card ── */

  .context-card {
    background: var(--grey-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 24px;
    font-size: 14.5px;
    line-height: 1.7;
  }

  .context-card p + p {
    margin-top: 12px;
  }

  /* ── Progress Bar ── */

  .progress-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .progress-text {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    min-width: 80px;
  }

  .progress-bar {
    flex: 1;
    background: var(--border);
    height: 4px;
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    background: var(--orange);
    height: 100%;
    width: 0%;
    transition: width 0.3s ease;
    border-radius: 2px;
  }

  /* ── Video Player ── */

  .video-wrapper {
    background: var(--grey-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 16px;
  }

  .meeting-video {
    width: 100%;
    border-radius: 6px;
    display: block;
    background: #000;
  }

  .notes-prompt {
    font-size: 14px;
    color: var(--dark-blue);
    margin-bottom: 24px;
    padding: 12px 16px;
    background: var(--orange-soft);
    border-left: 3px solid var(--orange);
    border-radius: 0 6px 6px 0;
  }

  .notes-prompt strong {
    font-weight: 700;
  }

  /* ── Pivot Card (what just happened, part 2 intro) ── */

  .pivot-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-left: 4px solid var(--purple);
    border-radius: 0 10px 10px 0;
    padding: 20px 24px;
    margin-bottom: 24px;
    font-size: 14.5px;
    line-height: 1.7;
  }

  .pivot-card .pivot-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--purple);
    font-weight: 600;
    margin-bottom: 12px;
  }

  .pivot-card p + p {
    margin-top: 12px;
  }

  /* ── Question Prompt ── */

  .question-prompt {
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  /* ── Multiple-choice options ── */

  .options-group {
    list-style: none;
    margin-bottom: 20px;
  }

  .option-btn {
    display: block;
    width: 100%;
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 8px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    color: var(--dark-blue);
    text-align: left;
    cursor: pointer;
    line-height: 1.5;
    transition: border-color 0.15s, background 0.15s;
  }

  .option-btn:hover:not(.disabled) {
    border-color: var(--electric-blue);
    background: #f5f7ff;
  }

  .option-btn:focus-visible {
    outline: 2px solid var(--electric-blue);
    outline-offset: 2px;
  }

  .option-btn.selected {
    border-color: var(--electric-blue);
    background: #eef2ff;
  }

  .option-btn.disabled {
    cursor: default;
    opacity: 0.7;
  }

  .option-btn .option-label {
    display: inline-block;
    font-weight: 700;
    min-width: 24px;
    margin-right: 6px;
  }

  /* ── Free-text component ── */

  .freetext-area {
    width: 100%;
    min-height: 110px;
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--dark-blue);
    resize: vertical;
    margin-bottom: 12px;
  }

  .freetext-area:focus {
    outline: 2px solid var(--electric-blue);
    outline-offset: 2px;
    border-color: var(--electric-blue);
  }

  .freetext-area.locked {
    background: var(--grey-bg);
    color: var(--dark-blue);
  }

  .freetext-hint {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
    line-height: 1.5;
  }

  .btn-reveal {
    background: var(--white);
    color: var(--dark-blue);
    border: 1.5px solid var(--orange);
    margin-bottom: 16px;
  }

  .btn-reveal:hover:not(:disabled) {
    background: var(--orange-soft);
  }

  /* Model + rubric card */

  .model-card {
    background: var(--model-bg);
    border: 1px solid var(--model-border);
    border-radius: 10px;
    padding: 20px 24px;
    margin-top: 16px;
    margin-bottom: 16px;
    display: none;
  }

  .model-card.visible {
    display: block;
  }

  .model-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--electric-blue);
    margin-bottom: 6px;
  }

  .model-response {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.6;
    margin-bottom: 18px;
    font-style: italic;
  }

  .rubric {
    border-top: 1px solid var(--model-border);
    padding-top: 16px;
  }

  .rubric-lead {
    font-size: 13.5px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .rubric-instruction {
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 10px;
    font-style: italic;
  }

  .rubric-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .rubric-list li {
    margin-bottom: 4px;
  }

  .rubric-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 13.5px;
    line-height: 1.6;
    user-select: none;
    transition: background 0.15s;
  }

  .rubric-item:hover {
    background: rgba(36, 84, 255, 0.06);
  }

  .rubric-checkbox {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
    margin: 0;
    pointer-events: none;
  }

  .rubric-box {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--electric-blue);
    border-radius: 4px;
    background: var(--white);
    margin-top: 2px;
    position: relative;
    transition: background 0.15s, border-color 0.15s;
  }

  .rubric-checkbox:checked ~ .rubric-box {
    background: var(--electric-blue);
    border-color: var(--electric-blue);
  }

  .rubric-checkbox:checked ~ .rubric-box::after {
    content: '';
    position: absolute;
    left: 5px;
    top: 1px;
    width: 5px;
    height: 10px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .rubric-checkbox:focus-visible ~ .rubric-box {
    outline: 2px solid var(--orange);
    outline-offset: 2px;
  }

  .rubric-text {
    flex: 1;
  }

  .rubric-text strong {
    font-weight: 700;
  }

  .why-it-works {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--model-border);
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--dark-blue);
  }

  .why-it-works .label {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--electric-blue);
    display: block;
    margin-bottom: 4px;
  }

  /* Tempting moves disclosure */

  .tempting-toggle {
    display: block;
    width: 100%;
    background: transparent;
    border: none;
    border-top: 1px solid var(--model-border);
    padding: 12px 0 0;
    margin-top: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--dark-blue);
    cursor: pointer;
    text-align: left;
  }

  .tempting-toggle:focus-visible {
    outline: 2px solid var(--electric-blue);
    outline-offset: 2px;
  }

  .tempting-toggle::after {
    content: ' \25B8';
    color: var(--muted);
  }

  .tempting-toggle.expanded::after {
    content: ' \25BE';
  }

  .tempting-list {
    display: none;
    margin-top: 10px;
  }

  .tempting-list.visible {
    display: block;
  }

  .tempting-item {
    border-left: 3px solid var(--incorrect-border);
    padding: 8px 14px;
    margin-bottom: 10px;
    font-size: 13px;
    line-height: 1.6;
    background: var(--white);
    border-radius: 0 6px 6px 0;
  }

  .tempting-item .move {
    font-style: italic;
    color: var(--dark-blue);
    margin-bottom: 4px;
  }

  .tempting-item .why {
    color: var(--muted);
  }

  /* ── Buttons ── */

  .btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 28px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: opacity 0.15s, background 0.15s;
  }

  .btn:focus-visible {
    outline: 2px solid var(--electric-blue);
    outline-offset: 2px;
  }

  .btn-submit {
    background: var(--orange);
    color: var(--dark-blue);
  }

  .btn-submit:hover:not(:disabled) {
    opacity: 0.9;
  }

  .btn-submit:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .btn-next {
    background: var(--electric-blue);
    color: var(--white);
    margin-top: 16px;
  }

  .btn-next:hover {
    opacity: 0.9;
  }

  /* ── Feedback Panel (MC) ── */

  .feedback-panel {
    border-radius: 8px;
    padding: 20px 24px;
    margin-top: 16px;
    font-size: 14px;
    line-height: 1.7;
    display: none;
  }

  .feedback-panel.visible {
    display: block;
  }

  .feedback-panel.correct {
    background: var(--correct-bg);
    border-left: 4px solid var(--green);
  }

  .feedback-panel.incorrect {
    background: var(--incorrect-bg);
    border-left: 4px solid var(--incorrect-border);
  }

  .feedback-label {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .feedback-label.correct {
    color: var(--green);
  }

  .feedback-label.incorrect {
    color: #dc2626;
  }

  .feedback-text {
    font-size: 14px;
  }

  /* ── Results Screen ── */

  .results-screen {
    display: none;
  }

  .results-screen.active {
    display: block;
  }

  .completion-card {
    background: var(--dark-blue);
    color: var(--white);
    border-radius: 10px;
    padding: 28px 24px;
    text-align: center;
    margin-bottom: 24px;
  }

  .completion-check {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--orange);
    color: var(--dark-blue);
    font-size: 24px;
    font-weight: 700;
    line-height: 48px;
    margin: 0 auto 12px;
  }

  .completion-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 18px;
  }

  .completion-card .score-number {
    font-size: 42px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
    color: var(--orange);
  }

  .completion-card .score-label {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 16px;
  }

  .completion-card .score-bar-container {
    background: rgba(255, 255, 255, 0.15);
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    max-width: 300px;
    margin: 0 auto 18px;
  }

  .completion-card .score-bar-fill {
    height: 100%;
    border-radius: 4px;
    background: var(--orange);
    transition: width 0.5s ease;
  }

  .completion-sub {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.7);
    line-height: 1.6;
    max-width: 480px;
    margin: 0 auto;
  }

  /* Debrief */

  .debrief-card {
    background: var(--white);
    border: 2px solid var(--orange);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 24px;
    font-size: 14.5px;
    line-height: 1.7;
  }

  .debrief-card h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .debrief-card p + p {
    margin-top: 12px;
  }

  /* Review Section */

  .review-toggle {
    display: block;
    width: 100%;
    background: var(--grey-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    color: var(--dark-blue);
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    margin-bottom: 16px;
  }

  .review-toggle:focus-visible {
    outline: 2px solid var(--electric-blue);
    outline-offset: 2px;
  }

  .review-toggle::after {
    content: ' \25B8';
  }

  .review-toggle.expanded::after {
    content: ' \25BE';
  }

  .review-section {
    display: none;
  }

  .review-section.visible {
    display: block;
  }

  .review-item {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px;
    margin-bottom: 12px;
  }

  .review-item .review-q-number {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .review-item .review-prompt {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 10px;
  }

  .review-item .review-answer {
    font-size: 13px;
    margin-bottom: 4px;
  }

  .review-item .review-answer.yours {
    color: var(--dark-blue);
  }

  .review-item .review-answer.correct-answer {
    color: var(--green);
  }

  .review-item .review-feedback {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.6;
  }

  .review-item .review-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 2px 8px;
    border-radius: 4px;
    margin-bottom: 10px;
  }

  .review-badge-correct {
    background: var(--correct-bg);
    color: var(--green);
  }

  .review-badge-incorrect {
    background: var(--incorrect-bg);
    color: #dc2626;
  }

  .review-badge-written {
    background: var(--model-bg);
    color: var(--electric-blue);
  }

  .review-typed {
    background: var(--grey-bg);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.6;
    margin: 6px 0 10px;
    white-space: pre-wrap;
    font-style: italic;
    color: var(--dark-blue);
  }

  .review-typed.empty {
    color: var(--muted);
    font-style: normal;
  }

  .review-model {
    background: var(--model-bg);
    border-left: 3px solid var(--electric-blue);
    border-radius: 0 6px 6px 0;
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.6;
    margin: 6px 0 10px;
    font-style: italic;
    color: var(--dark-blue);
  }

  .review-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .review-rubric {
    list-style: none;
    padding: 0;
    margin: 0 0 10px;
  }

  .review-rubric li {
    position: relative;
    padding-left: 24px;
    margin-bottom: 6px;
    font-size: 13px;
    line-height: 1.55;
  }

  .review-rubric li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 4px;
    width: 14px;
    height: 14px;
    border-radius: 3px;
    border: 1.5px solid var(--border);
    background: var(--white);
  }

  .review-rubric li.ticked {
    color: var(--dark-blue);
  }

  .review-rubric li.ticked::before {
    background: var(--green);
    border-color: var(--green);
  }

  .review-rubric li.ticked::after {
    content: '';
    position: absolute;
    left: 4px;
    top: 6px;
    width: 4px;
    height: 8px;
    border: solid white;
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
  }

  .review-rubric li.unticked {
    color: var(--muted);
  }

  .review-rubric li strong {
    font-weight: 700;
  }

  /* Close note */

  .close-note {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  /* ── Responsive ── */

  @media (max-width: 480px) {
    .container {
      padding: 24px 16px 40px;
    }
    .header h1 {
      font-size: 22px;
    }
    .option-btn {
      padding: 12px 14px;
    }
    .model-card,
    .review-item {
      padding: 16px 18px;
    }
  }
</style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="label">Interactive Exercise</div>
    <h1 id="interactiveTitle"></h1>
    <div class="subtitle" id="interactiveSubtitle"></div>
  </div>

  <!-- Question Area (populated by JS) -->
  <div id="questionArea"></div>

  <!-- Results Screen -->
  <div class="results-screen" id="resultsScreen"></div>

</div>

<script>
// ─────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────

const interactiveData = {
  title: "When feedback catches you off guard",
  subtitle: "About 10 minutes",
  context: `You're 12 minutes into Development Check-In #1 with Bridgeway Community Health. David Park is on the call. Since the Direction Check, your team has been building a draft research synthesis and a set of recommendations for how Bridgeway can adjust its workshop program to support behavior change in the communities they serve.

You walked David through three things at the top of the meeting: the draft structure, your strongest finding from the research, and your headline recommendation — a peer health navigator program that would pair workshop participants with trained members of their own community for follow-up support.

You finished the walk-through. David has been listening and writing things down. Now it's his turn.`,
  videoSrc1: "https://riipen-product.s3.ca-central-1.amazonaws.com/career-catalyst/Development+Check-in+with+David+Park+-+Part+1.mp4",
  videoSrc2: "https://riipen-product.s3.ca-central-1.amazonaws.com/career-catalyst/Development+Check-in+with+David+Park+-+Part+2.mp4",
  notesPrompt: "Have a notebook open before you press play. You'll work through the moves of the reception protocol — Listen, Clarify, Acknowledge, Decide later — and on three of them, you'll write the actual words you'd say.",
  whatJustHappened: `The peer navigator program is the team's strongest recommendation. It's the one you've spent the most time on. None of your secondary research mentioned that Bridgeway had tried this before, and the educators you spoke with at the Direction Check follow-up didn't bring it up either. David is now telling you it exists, that it didn't work, and he's deliberately holding back the details.`,
  part2Intro: `Your team asks a clarifying question. David takes a beat, then responds.`,
  questions: [
    {
      id: 1,
      type: 'multiple-choice',
      prompt: "While David was talking, you felt the urge to interrupt and explain why your team's version is different. What was the best move?",
      options: [
        { label: "A", text: "Interrupt now to clarify that your team's design is based on more recent research and might avoid the issues he ran into." },
        { label: "B", text: "Hold off, let David finish, and listen for whether he names anything specific about what went wrong." },
        { label: "C", text: "Start typing your team's response into the chat so you're ready to defend the recommendation the moment he stops talking." },
        { label: "D", text: "Signal to a teammate to take over the conversation so you don't have to respond." }
      ],
      correctAnswer: "B",
      feedback: {

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────

let currentQuestion = 0;
let answers = [];
let selectedOption = null;


// ─────────────────────────────────────────────
// INITIALIZATION
// ─────────────────────────────────────────────

function init() {
  document.getElementById('interactiveTitle').textContent = interactiveData.title;
  document.getElementById('interactiveSubtitle').textContent = interactiveData.subtitle;
  document.title = interactiveData.title + ' — Riipen Career Catalyst';
  renderContext();
}

function renderContext() {
  const area = document.getElementById('questionArea');
  let html = '';

  html += '<div class="context-card">';
  html += formatParagraphs(interactiveData.context);
  html += '</div>';

  html += renderVideo(interactiveData.videoSrc1);

  if (interactiveData.notesPrompt) {
    html += '<div class="notes-prompt">' + escapeHtml(interactiveData.notesPrompt) + '</div>';
  }

  html += '<button class="btn btn-submit" onclick="renderPivot()" aria-label="Continue">Continue</button>';

  area.innerHTML = html;
}

function renderPivot() {
  const area = document.getElementById('questionArea');
  let html = '';

  html += '<div class="pivot-card">';
  html += '<div class="pivot-label">What just happened</div>';
  html += formatParagraphs(interactiveData.whatJustHappened);
  html += '</div>';

  html += '<button class="btn btn-submit" onclick="startQuestions()" aria-label="Begin the questions">Begin questions</button>';

  area.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}


// ─────────────────────────────────────────────
// QUESTION RENDERING
// ─────────────────────────────────────────────

function startQuestions() {
  currentQuestion = 0;
  answers = [];
  selectedOption = null;
  renderQuestion();
}

function renderProgress() {
  const total = interactiveData.questions.length;
  let html = '';
  html += '<div class="progress-wrapper">';
  html += '  <span class="progress-text" aria-live="polite">Question ' + (currentQuestion + 1) + ' of ' + total + '</span>';
  html += '  <div class="progress-bar" role="progressbar" aria-valuenow="' + (currentQuestion + 1) + '" aria-valuemin="1" aria-valuemax="' + total + '">';
  html += '    <div class="progress-fill" style="width: ' + ((currentQuestion + 1) / total * 100) + '%"></div>';
  html += '  </div>';
  html += '</div>';
  return html;
}

function renderQuestion() {
  const q = interactiveData.questions[currentQuestion];
  const area = document.getElementById('questionArea');

  selectedOption = null;

  let html = renderProgress();
  html += '<div class="question-prompt" id="questionPrompt">' + escapeHtml(q.prompt) + '</div>';

  if (q.type === 'free-text') {
    html += renderFreeTextBody(q);
  } else {
    html += renderMultipleChoiceBody(q);
  }

  area.innerHTML = html;

  var prompt = document.getElementById('questionPrompt');
  prompt.setAttribute('tabindex', '-1');
  prompt.focus();

  if (q.type === 'multiple-choice') {
    setupKeyboardNav();
  } else {
    var ta = document.getElementById('freetextArea');
    if (ta) ta.focus();
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderMultipleChoiceBody(q) {
  let html = '';
  html += '<div class="options-group" role="radiogroup" aria-labelledby="questionPrompt">';
  q.options.forEach(function(opt) {
    html += '<button class="option-btn" role="radio" aria-checked="false" ';
    html += 'data-label="' + opt.label + '" ';
    html += 'onclick="handleSelect(\'' + opt.label + '\')" ';
    html += 'tabindex="0">';
    html += '<span class="option-label">' + escapeHtml(opt.label) + '.</span> ';
    html += escapeHtml(opt.text);
    html += '</button>';
  });
  html += '</div>';

  html += '<button class="btn btn-submit" id="submitBtn" onclick="handleSubmit()" disabled aria-label="Submit your answer">Submit</button>';
  html += '<div class="feedback-panel" id="feedbackPanel" role="status" aria-live="polite"></div>';

  return html;
}

function renderFreeTextBody(q) {
  let html = '';
  html += '<textarea class="freetext-area" id="freetextArea" placeholder="' + escapeHtml(q.placeholder || 'Type your response…') + '" aria-label="Your response"></textarea>';
  html += '<div class="freetext-hint">Write your response, then reveal a strong version. You\'ll self-check which criteria your response met — that feeds your final score.</div>';
  html += '<button class="btn btn-reveal" id="revealBtn" onclick="handleReveal()" aria-label="Show a strong response">Show a strong response →</button>';

  html += '<div class="model-card" id="modelCard" aria-live="polite">';
  html += '  <div class="model-label">A strong response</div>';
  html += '  <div class="model-response">' + escapeHtml(q.modelResponse) + '</div>';
  html += '  <div class="rubric">';
  html += '    <div class="rubric-lead">' + escapeHtml(q.rubricLead) + '</div>';
  html += '    <div class="rubric-instruction">Tick each one your response met — your self-check feeds the final score.</div>';
  html += '    <ul class="rubric-list" role="group" aria-label="Self-check rubric">';
  q.rubric.forEach(function(item, idx) {
    html += '<li>';
    html += '<label class="rubric-item">';
    html += '<input type="checkbox" class="rubric-checkbox" data-idx="' + idx + '">';
    html += '<span class="rubric-box" aria-hidden="true"></span>';
    html += '<span class="rubric-text">' + formatInline(item) + '</span>';
    html += '</label>';
    html += '</li>';
  });
  html += '    </ul>';
  html += '  </div>';

  if (q.whyItWorks) {
    html += '<div class="why-it-works"><span class="label">Why this works</span>' + escapeHtml(q.whyItWorks) + '</div>';
  }

  if (q.temptingMoves && q.temptingMoves.length) {
    html += '<button class="tempting-toggle" id="temptingToggle" onclick="toggleTempting()" aria-expanded="false" aria-controls="temptingList">Tempting moves to check yourself against</button>';
    html += '<div class="tempting-list" id="temptingList">';
    q.temptingMoves.forEach(function(t) {
      html += '<div class="tempting-item">';
      html += '<div class="move">' + escapeHtml(t.move) + '</div>';
      html += '<div class="why">' + escapeHtml(t.why) + '</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  var isLast = currentQuestion >= interactiveData.questions.length - 1;
  var nextLabel = isLast ? 'See results' : 'Next';
  html += '<button class="btn btn-next" id="nextBtn" onclick="advanceFromFreeText()" aria-label="' + (isLast ? 'See your results' : 'Go to next question') + '">' + nextLabel + ' →</button>';

  html += '</div>';
  return html;
}

function setupKeyboardNav() {
  var options = document.querySelectorAll('.option-btn');
  options.forEach(function(btn, index) {
    btn.addEventListener('keydown', function(e) {
      var target = null;
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        e.preventDefault();
        target = options[(index + 1) % options.length];
      } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        e.preventDefault();
        target = options[(index - 1 + options.length) % options.length];
      } else if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        btn.click();
      }
      if (target) target.focus();
    });
  });
}


// ─────────────────────────────────────────────
// PART 2 VIDEO (plays before Q3)
// ─────────────────────────────────────────────

function renderPart2() {
  const area = document.getElementById('questionArea');
  let html = '';

  html += renderProgress();

  html += '<div class="pivot-card">';
  html += '<div class="pivot-label">The conversation continues</div>';
  html += formatParagraphs(interactiveData.part2Intro);
  html += '</div>';

  html += renderVideo(interactiveData.videoSrc2);

  html += '<button class="btn btn-submit" onclick="renderQuestion()" aria-label="Continue to the next question">Continue</button>';

  area.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}


// ─────────────────────────────────────────────
// MULTIPLE-CHOICE HANDLERS
// ─────────────────────────────────────────────

function handleSelect(label) {
  if (document.getElementById('feedbackPanel').classList.contains('visible')) return;

  selectedOption = label;

  document.querySelectorAll('.option-btn').forEach(function(btn) {
    var isSelected = btn.dataset.label === label;
    btn.classList.toggle('selected', isSelected);
    btn.setAttribute('aria-checked', isSelected ? 'true' : 'false');
  });

  document.getElementById('submitBtn').disabled = false;
}

function handleSubmit() {
  if (!selectedOption) return;

  var q = interactiveData.questions[currentQuestion];
  var isCorrect = selectedOption === q.correctAnswer;

  answers.push({
    questionId: q.id,
    type: 'multiple-choice',
    selectedLabel: selectedOption,
    isCorrect: isCorrect
  });

  document.querySelectorAll('.option-btn').forEach(function(btn) {
    btn.classList.add('disabled');
    btn.setAttribute('tabindex', '-1');
  });

  document.getElementById('submitBtn').style.display = 'none';

  var panel = document.getElementById('feedbackPanel');
  var feedbackText = '';
  var feedbackType = '';

  if (isCorrect) {
    feedbackType = 'correct';
    feedbackText = q.feedback.correct;
  } else {
    feedbackType = 'incorrect';
    feedbackText = q.feedback.incorrect[selectedOption] || q.feedback.incorrect['default'] || "That's not quite right.";
  }

  var isLast = currentQuestion >= interactiveData.questions.length - 1;
  var nextLabel = isLast ? 'See results' : 'Next';

  panel.className = 'feedback-panel visible ' + feedbackType;
  panel.innerHTML =
    '<div class="feedback-label ' + feedbackType + '">' +
    (isCorrect ? '✓ Correct' : 'Not quite') +
    '</div>' +
    '<div class="feedback-text">' + escapeHtml(feedbackText) + '</div>' +
    '<button class="btn btn-next" onclick="nextQuestion()" aria-label="' +
    (isLast ? 'See your results' : 'Go to next question') +
    '">' + nextLabel + ' →</button>';

  panel.setAttribute('tabindex', '-1');
  panel.focus();
}


// ─────────────────────────────────────────────
// FREE-TEXT HANDLERS
// ─────────────────────────────────────────────

function handleReveal() {
  var card = document.getElementById('modelCard');
  var revealBtn = document.getElementById('revealBtn');
  var ta = document.getElementById('freetextArea');

  card.classList.add('visible');
  revealBtn.style.display = 'none';
  ta.classList.add('locked');
  ta.setAttribute('readonly', 'readonly');

  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function advanceFromFreeText() {
  var q = interactiveData.questions[currentQuestion];
  var ta = document.getElementById('freetextArea');
  var typed = ta ? ta.value.trim() : '';

  var rubricChecked = new Array(q.rubric.length).fill(false);
  document.querySelectorAll('.rubric-checkbox').forEach(function(cb) {
    var idx = parseInt(cb.dataset.idx, 10);
    if (!isNaN(idx) && idx >= 0 && idx < rubricChecked.length) {
      rubricChecked[idx] = cb.checked;
    }
  });

  answers.push({
    questionId: q.id,
    type: 'free-text',
    typed: typed,
    rubricChecked: rubricChecked
  });

  nextQuestion();
}

function toggleTempting() {
  var toggle = document.getElementById('temptingToggle');
  var list = document.getElementById('temptingList');
  var expanded = toggle.classList.toggle('expanded');
  list.classList.toggle('visible', expanded);
  toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
}


// ─────────────────────────────────────────────
// FLOW CONTROL
// ─────────────────────────────────────────────

function nextQuestion() {
  currentQuestion++;
  if (currentQuestion >= interactiveData.questions.length) {
    showResults();
    return;
  }
  selectedOption = null;
  var q = interactiveData.questions[currentQuestion];
  if (q.precedingVideoStep && interactiveData.videoSrc2) {
    renderPart2();
  } else {
    renderQuestion();
  }
}


// ─────────────────────────────────────────────
// RESULTS SCREEN
// ─────────────────────────────────────────────

function showResults() {
  document.getElementById('questionArea').innerHTML = '';

  var score = computeScore();
  var mcAnswers = answers.filter(function(a) { return a.type === 'multiple-choice'; });
  var freeAnswered = answers.filter(function(a) { return a.type === 'free-text'; }).length;

  var screen = document.getElementById('resultsScreen');
  screen.classList.add('active');

  var html = '';

  html += '<div class="completion-card">';
  html += '  <div class="completion-check" aria-hidden="true">✓</div>';
  html += '  <div class="completion-title">Exercise complete</div>';
  html += '  <div class="score-number" aria-live="polite">' + score.pct + '%</div>';
  html += '  <div class="score-label">of the criteria met across the exercise</div>';
  html += '  <div class="score-bar-container">';
  html += '    <div class="score-bar-fill" style="width: ' + score.pct + '%" role="img" aria-label="Score: ' + score.pct + ' percent"></div>';
  html += '  </div>';
  html += '  <div class="completion-sub">You worked through ' + mcAnswers.length + ' read-the-room moves and produced ' + freeAnswered + ' written responses. Multiple-choice was scored against the best answer; written responses were scored against your own self-check.</div>';
  html += '</div>';

  html += '<div class="debrief-card">';
  html += '  <h3>What you just practiced</h3>';
  html += formatParagraphs(interactiveData.debrief);
  html += '</div>';

  html += '<button class="review-toggle" id="reviewToggle" onclick="toggleReview()" aria-expanded="false" aria-controls="reviewSection">Review your answers</button>';

  html += '<div class="review-section" id="reviewSection" role="region" aria-label="Answer review">';
  interactiveData.questions.forEach(function(q, i) {
    var answer = answers[i];
    html += '<div class="review-item">';
    html += '  <div class="review-q-number">Question ' + (i + 1) + '</div>';

    if (answer.type === 'multiple-choice') {
      var selectedOpt = q.options.find(function(o) { return o.label === answer.selectedLabel; });
      var correctOpt = q.options.find(function(o) { return o.label === q.correctAnswer; });
      var feedbackText = answer.isCorrect
        ? q.feedback.correct
        : (q.feedback.incorrect[answer.selectedLabel] || q.feedback.incorrect['default'] || '');

      html += '  <span class="review-badge ' + (answer.isCorrect ? 'review-badge-correct' : 'review-badge-incorrect') + '">';
      html += answer.isCorrect ? 'Correct' : 'Incorrect';
      html += '</span>';
      html += '  <div class="review-prompt">' + escapeHtml(q.prompt) + '</div>';
      html += '  <div class="review-answer yours"><strong>Your answer:</strong> ' + escapeHtml(answer.selectedLabel + '. ' + selectedOpt.text) + '</div>';
      if (!answer.isCorrect) {
        html += '  <div class="review-answer correct-answer"><strong>Best answer:</strong> ' + escapeHtml(q.correctAnswer + '. ' + correctOpt.text) + '</div>';
      }
      html += '  <div class="review-feedback">' + escapeHtml(feedbackText) + '</div>';
    } else {
      var rubricLen = q.rubric.length;
      var checkedCount = (answer.rubricChecked || []).filter(Boolean).length;
      html += '  <span class="review-badge review-badge-written">Met ' + checkedCount + ' of ' + rubricLen + ' criteria</span>';
      html += '  <div class="review-prompt">' + escapeHtml(q.prompt) + '</div>';
      html += '  <div class="review-label">What you wrote</div>';
      if (answer.typed) {
        html += '  <div class="review-typed">' + escapeHtml(answer.typed) + '</div>';
      } else {
        html += '  <div class="review-typed empty">(You didn\'t type a response for this one.)</div>';
      }
      html += '  <div class="review-label">A strong response</div>';
      html += '  <div class="review-model">' + escapeHtml(q.modelResponse) + '</div>';
      html += '  <div class="review-label">Your self-check</div>';
      html += '  <ul class="review-rubric">';
      q.rubric.forEach(function(item, ri) {
        var ticked = (answer.rubricChecked || [])[ri];
        html += '<li class="' + (ticked ? 'ticked' : 'unticked') + '">' + formatInline(item) + '</li>';
      });
      html += '  </ul>';
      html += '  <div class="review-feedback">' + escapeHtml(q.whyItWorks) + '</div>';
    }

    html += '</div>';
  });
  html += '</div>';

  html += '<div class="close-note">You can close this tab to return to the course.</div>';

  screen.innerHTML = html;

  window.scrollTo({ top: 0, behavior: 'smooth' });
  var card = screen.querySelector('.completion-card');
  card.setAttribute('tabindex', '-1');
  card.focus();
}

function toggleReview() {
  var toggle = document.getElementById('reviewToggle');
  var section = document.getElementById('reviewSection');
  var expanded = toggle.classList.toggle('expanded');
  section.classList.toggle('visible', expanded);
  toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
}


// ─────────────────────────────────────────────
// UTILITIES
// ─────────────────────────────────────────────

function computeScore() {
  var totalPoints = 0;
  var earnedPoints = 0;
  answers.forEach(function(answer, idx) {
    var q = interactiveData.questions[idx];
    if (!q) return;
    totalPoints += 1;
    if (answer.type === 'multiple-choice') {
      if (answer.isCorrect) earnedPoints += 1;
    } else {
      var checked = (answer.rubricChecked || []).filter(Boolean).length;
      var rubricLen = q.rubric ? q.rubric.length : 0;
      if (rubricLen > 0) {
        earnedPoints += checked / rubricLen;
      }
    }
  });
  return {
    earned: earnedPoints,
    total: totalPoints,
    pct: totalPoints > 0 ? Math.round((earnedPoints / totalPoints) * 100) : 0
  };
}

function renderVideo(src) {
  if (!src) return '';
  let html = '';
  html += '<div class="video-wrapper">';
  html += '<video class="meeting-video" controls preload="metadata">';
  html += '<source src="' + escapeHtml(src) + '" type="video/mp4">';
  html += 'Your browser does not support embedded video. <a href="' + escapeHtml(src) + '">Download the recording</a>.';
  html += '</video>';
  html += '</div>';
  return html;
}

function escapeHtml(text) {
  if (text == null) return '';
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatInline(text) {
  // Escape HTML, then promote **bold** → <strong> and *italic* → <em>
  var safe = escapeHtml(text);
  safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  safe = safe.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  return safe;
}

function formatParagraphs(text) {
  return text.split('\n\n').map(function(p) {
    return '<p>' + escapeHtml(p.trim()) + '</p>';
  }).join('');
}

init();
